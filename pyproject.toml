[project]
name = "pkgmap"
version = "0.1.0"
description = "Cross-distribution Linux package name resolution"
authors = [{ name = "Levizor", email = "levizor@disroot.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "zstandard>=0.22.0",
]

[project.scripts]
pkgmap = "pkgmap.cli:main"
pkgmap-pipeline = "pkgmap.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
