name: Generate Database Release

on:
  schedule:
    # Run daily at 05:00 UTC (Repology finishes dump generation around 04:11 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size for database ingestion'
        required: false
        default: '50000'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Repology dump
        id: dump
        run: uv run pkgmap-pipeline download

      - name: Build SQLite database
        run: |
          uv run pkgmap-pipeline build \
            -i "${{ steps.dump.outputs.dump_path }}" \
            -o pkgmap.db \
            -c pkgmap-core.db \
            --dump-date "${{ steps.dump.outputs.date }}" \
            --release-notes release_notes.md \
            --batch-size ${{ inputs.batch_size || '50000' }}

      - name: Compress databases and generate checksums
        run: |
          sha256sum pkgmap.db > pkgmap.db.sha256
          zstd -19 -T0 pkgmap.db -o pkgmap.db.zst
          zstd -t pkgmap.db.zst
          sha256sum pkgmap.db.zst > pkgmap.db.zst.sha256

          sha256sum pkgmap-core.db > pkgmap-core.db.sha256
          zstd -19 -T0 pkgmap-core.db -o pkgmap-core.db.zst
          zstd -t pkgmap-core.db.zst
          sha256sum pkgmap-core.db.zst > pkgmap-core.db.zst.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dump.outputs.tag }}
          name: "pkgmap.db"
          body_path: release_notes.md
          make_latest: true
          files: |
            pkgmap.db
            pkgmap.db.sha256
            pkgmap.db.zst
            pkgmap.db.zst.sha256
            pkgmap-core.db
            pkgmap-core.db.sha256
            pkgmap-core.db.zst
            pkgmap-core.db.zst.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old database releases
        run: |
          gh release list --limit 100 --json tagName --jq '.[] | .tagName | select(startswith("db-"))' | tail -n +8 | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pruning database release: $tag"
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
